# Dependabot will run on day 28 of each month at 02:42 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "42 2 28 * *"
    cooldown:
      default-days: 7    
    open-pull-requests-limit: 15
    assignees:
      - "Author"
    versioning-strategy: "increase"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "42 2 28 * *"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - "Author"
